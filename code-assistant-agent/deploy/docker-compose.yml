version: "3.9"

services:
  backend:
    image: eclipse-temurin:17-jre
    container_name: code-assistant-backend
    working_dir: /app
    command: ["java", "-jar", "/app/backend/app.jar"]
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SERVER_PORT: 8080
    volumes:
      - ./backend:/app/backend:ro
    networks:
      - app-net

  frontend:
    image: nginx:1.27-alpine
    container_name: code-assistant-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - app-net

networks:
  app-net:
    driver: bridge
